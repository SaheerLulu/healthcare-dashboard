# -------------------------------------------------------
# DEV bootstrap – HTTP only (use until certbot creates SSL certs)
# Run: sudo certbot certonly --webroot -w /var/www/certbot -d dev.dashboards.seefmed.com
# Then redeploy (or copy dev.conf) to switch to HTTPS
# -------------------------------------------------------

server {
    listen 80;
    server_name dev.dashboards.seefmed.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
