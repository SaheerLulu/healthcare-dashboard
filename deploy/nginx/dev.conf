# -------------------------------------------------------
# Nginx reverse-proxy – DEV environment
# dev.dashboards.seefmed.com  →  dashboard-dev-frontend:80
# -------------------------------------------------------
# Place in /etc/nginx/sites-available/devdashboards.conf
# sudo ln -s /etc/nginx/sites-available/devdashboards.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# -------------------------------------------------------

server {
    listen 80;
    server_name dev.dashboards.seefmed.com;

    # Redirect HTTP → HTTPS (after certbot sets up the cert)
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.dashboards.seefmed.com;

    # SSL certs managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/dev.dashboards.seefmed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.dashboards.seefmed.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;

    # Proxy to dev frontend container on port 3005
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
